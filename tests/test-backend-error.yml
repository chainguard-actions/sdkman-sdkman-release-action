name: Test backend error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock SDKMAN backend returning error
        run: |
          python3 -c "
          import http.server, threading, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(401)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'message': 'Unauthorized'}).encode())
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 8768), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock error backend started on port 8768"

      - id: action
        uses: .
        continue-on-error: true
        with:
          consumer-key: "invalid-key"
          consumer-token: "invalid-token"
          candidate: "mycandidate"
          version: "1.0.0"
          url: "https://example.com/mycandidate-1.0.0.zip"
          backend: "http://127.0.0.1:8768"

      - name: Assert action failed on unauthorized response
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on 401 Unauthorized, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on unauthorized backend response"
