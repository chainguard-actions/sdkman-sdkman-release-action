name: Test release with checksums
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock SDKMAN backend
        run: |
          python3 -c "
          import http.server, threading, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(201)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'status': 'ok'}).encode())
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 8767), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock backend started on port 8767"

      - id: action
        uses: .
        with:
          consumer-key: "fake-consumer-key"
          consumer-token: "fake-consumer-token"
          candidate: "mycandidate"
          version: "3.0.0"
          url: "https://example.com/mycandidate-3.0.0.zip"
          platform: "UNIVERSAL"
          checksum-md5: "d41d8cd98f00b204e9800998ecf8427e"
          checksum-sha-256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          backend: "http://127.0.0.1:8767"

      - name: Assert action completed successfully
        run: |
          echo "Release with checksums action completed without error"
          echo "PASS"
