name: Test release with checksums
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          email: "test@example.com"
          password: "fake-password"
          candidate: "testcandidate"
          version: "2.0.0"
          url: "https://example.com/testcandidate-2.0.0.zip"
          platform: "UNIVERSAL"
          checksum-md5: "d8e8fca2dc0f896fd7cb4cb0031ba249"
          checksum-sha-256: "2c624232cdd221771294dfbb310acbc7b8f9b9a4d0f9b5c8b8e8e8e8e8e8e8e"
          checksum-sha-512: "cf83e1357eefb8bdf1542850d66d8007d620e4050b5715dc83f4a921d36ce9ce47d0d13c5d85f2b0ff8318d2877eec2f63b931bd47417a81a538327af927da3e"
      - name: Assert action ran and failed gracefully (invalid credentials, with checksums)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real credentials?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid credentials (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
