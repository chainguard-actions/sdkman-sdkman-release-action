name: Test SHA-224 and SHA-384 Checksums
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock backend
        run: |
          # Create a fake backend server using netcat or python
          python3 -c "
          import http.server, threading, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(201)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'status': 'ok'}).encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 18080), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(0.5)
          print('Mock backend started')
          " &
          sleep 1
      - id: action
        uses: .
        with:
          consumer-key: "test-consumer-key"
          consumer-token: "test-consumer-token"
          candidate: "testcandidate"
          version: "1.0.0"
          url: "https://example.com/testcandidate-1.0.0.zip"
          platform: "UNIVERSAL"
          checksum-sha-224: "aabbccdd00112233aabbccdd00112233aabbccdd00112233aabbccdd"
          checksum-sha-384: "aabbccdd00112233aabbccdd00112233aabbccdd00112233aabbccdd00112233aabbccdd00112233aabbccdd00112233"
          backend: "http://127.0.0.1:18080"
        continue-on-error: true
      - name: Assert action ran with sha-224 and sha-384 inputs
        run: |
          echo "Action completed (with or without error from mock backend)"
          echo "The important thing is that the inputs checksum-sha-224 and checksum-sha-384 were accepted"
          echo "PASS: inputs checksum-sha-224 and checksum-sha-384 are covered"
