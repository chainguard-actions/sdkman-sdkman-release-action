name: Test additional checksums (sha-1, sha-224, sha-384, sha-512)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          consumer-key: "test-consumer-key"
          consumer-token: "test-consumer-token"
          candidate: "testcandidate"
          version: "1.0.0"
          url: "https://example.com/testcandidate-1.0.0.zip"
          platform: "UNIVERSAL"
          checksum-sha-1: "da39a3ee5e6b4b0d3255bfef95601890afd80709"
          checksum-sha-224: "d14a028c2a3a2bc9476102bb288234c415a2b01f828ea62ac5b3e42f"
          checksum-sha-384: "38b060a751ac96384cd9327eb1b1e36a21fdb71114be07434c0cc7bf63f6e1da274edebfe76f65fbd51ad2f14898b95b"
          checksum-sha-512: "cf83e1357eefb8bdf1542850d66d8007d620e4050b5715dc83f4a921d36ce9ce47d0d13c5d85f2b0ff8318d2877eec2f63b931bd47417a81a538327af927da3e"
          backend: "http://localhost:19999"
      - name: Assert action ran (may fail due to mock backend)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because the backend is not reachable,
          # but we verify it was invoked (not skipped) which confirms inputs were accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with all additional checksum inputs"
