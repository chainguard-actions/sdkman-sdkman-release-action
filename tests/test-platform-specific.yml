name: Test platform-specific release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock SDKMAN backend
        run: |
          python3 -c "
          import http.server, threading, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(201)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'status': 'ok'}).encode())
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 8766), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock backend started on port 8766"

      - id: action
        uses: .
        with:
          consumer-key: "fake-consumer-key"
          consumer-token: "fake-consumer-token"
          candidate: "mycandidate"
          version: "2.0.0"
          url: "https://example.com/mycandidate-2.0.0-linux.zip"
          platform: "LINUX_64"
          backend: "http://127.0.0.1:8766"

      - name: Assert action completed successfully
        run: |
          echo "Platform-specific release action completed without error"
          echo "PASS"
