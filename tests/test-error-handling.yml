name: Test error handling - backend returns error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock SDKMAN! backend that returns 401
        run: |
          cat > /tmp/mock_sdkman_error_server.py << 'EOF'
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path == '/release':
                      length = int(self.headers.get('Content-Length', 0))
                      body = self.rfile.read(length)
                      # Return 401 Unauthorized to simulate invalid credentials
                      self.send_response(401)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(b'{"message":"Invalid consumer credentials"}')
                  else:
                      self.send_response(404)
                      self.end_headers()

              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 18082), Handler)
          server.serve_forever()
          EOF
          python3 /tmp/mock_sdkman_error_server.py &
          echo $! > /tmp/mock_server.pid
          sleep 1
          echo "Mock error server started on port 18082"

      - id: action
        uses: .
        continue-on-error: true
        with:
          consumer-key: "invalid-key"
          consumer-token: "invalid-token"
          candidate: "mycli"
          version: "1.0.0"
          url: "https://example.com/mycli-1.0.0.zip"
          backend: "http://127.0.0.1:18082"

      - name: Assert action failed due to backend error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when backend returns 401, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when backend returned an error"

      - name: Stop mock server
        if: always()
        run: |
          if [ -f /tmp/mock_server.pid ]; then
            kill $(cat /tmp/mock_server.pid) 2>/dev/null || true
          fi
